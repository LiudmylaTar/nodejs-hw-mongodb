type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType

properties:
  _id:
    description: "contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone"
    type: string
    example: 30958465415
  email:
    description: "Contact's mail"
    type: string
    example: example@mail.com
  isFavourite:
    description: 'Whether is favorite contact'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's person photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
