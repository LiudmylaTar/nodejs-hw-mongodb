tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: 'Update an existing contact by ID. Fields are optional.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: Jane Smith
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '1234567890'
          email:
            type: string
            description: Contact's email
            example: jane@example.com
          isFavourite:
            type: boolean
            description: Whether the contact is a favourite
            example: true
          contactType:
            type: string
            description: Contact type
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
            description: Contact's photo

responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Bad Request
  '401':
    $ref: ../../../components/responses/401.yaml
    '404':
    description: Contact not found
