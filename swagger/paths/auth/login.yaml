tags:
  - Auth
summary: Login a user
operationId: loginUser
description: Allows a user to login with email and password
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/loginRequest.yaml'
responses:
  '200':
    description: Login successful
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  '401':
    $ref: '../../components/responses/401.yaml'
